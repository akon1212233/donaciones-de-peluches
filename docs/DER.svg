<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="620" viewBox="0 0 1100 620">
<rect width="1100" height="620" fill="#fff"/>
<style>text{font-family:Arial,sans-serif;fill:#202020}.title{font-size:24px;font-weight:bold}.field{font-size:16px}.label{font-size:14px}</style>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L8 3 L0 6" fill="none" stroke="#333"/></marker></defs>
<text x="40" y="42" class="title">Donaciones de peluches — DER</text>
<rect x="40" y="100" width="300" height="210" fill="#fafafa" stroke="#333"/>
<rect x="40" y="100" width="300" height="44" fill="#dce7ef" stroke="#333"/>
<text x="54" y="129" class="title">usuarios</text>
<text x="54" y="172" class="field">PK  id_usuario : INT</text>
<text x="54" y="204" class="field">nombre : VARCHAR(100)</text>
<text x="54" y="236" class="field">apellido : VARCHAR(100)</text>
<text x="54" y="268" class="field">UK  email : VARCHAR(150)</text>
<text x="54" y="300" class="field">password_hash : VARCHAR(255)</text>
<rect x="680" y="100" width="380" height="274" fill="#fafafa" stroke="#333"/>
<rect x="680" y="100" width="380" height="44" fill="#dce7ef" stroke="#333"/>
<text x="694" y="129" class="title">peluches</text>
<text x="694" y="172" class="field">PK  id_peluche : INT</text>
<text x="694" y="204" class="field">UK  nombre : VARCHAR(100)</text>
<text x="694" y="236" class="field">descripcion : TEXT</text>
<text x="694" y="268" class="field">FK  id_estado : INT</text>
<text x="694" y="300" class="field">FK  id_donador : INT</text>
<text x="694" y="332" class="field">FK  id_adoptante : INT, NULL</text>
<text x="694" y="364" class="field">visitas : INT UNSIGNED = 0</text>
<rect x="40" y="390" width="300" height="114" fill="#fafafa" stroke="#333"/>
<rect x="40" y="390" width="300" height="44" fill="#dce7ef" stroke="#333"/>
<text x="54" y="419" class="title">estados</text>
<text x="54" y="462" class="field">PK  id_estado : INT</text>
<text x="54" y="494" class="field">estado : VARCHAR(50)</text>
<path d="M340 155 H480 V295 H680" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="365" y="140" class="label">Donador: 1 → 0..N peluches</text>
<path d="M340 255 H445 V335 H680" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="465" y="365" class="label">Adoptante: 0..1 → 0..N</text>
<path d="M340 450 H600 V265 H680" fill="none" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
<text x="355" y="480" class="label">Estado: 1 → 0..N peluches</text>
<text x="40" y="570" class="field">PK: clave primaria · FK: clave foránea · UK: valor único</text>
<text x="40" y="598" class="field">Estados: 1 Disponible / 2 Adoptado. El donador y el adoptante deben ser distintos.</text></svg>