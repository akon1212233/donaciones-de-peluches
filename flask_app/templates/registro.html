{% extends 'base.html' %}
{% block title %}Registro e Inicio de Sesión · Donación de Peluches{% endblock %}
{% block page_class %}auth-page{% endblock %}
{% block content %}
<div class="auth-grid">
    <section aria-labelledby="registro-titulo">
        <h1 id="registro-titulo">Registro</h1>
        <form action="{{ url_for('registro') }}" method="post" class="fields">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="nombre">Nombre</label>
            <input id="nombre" name="nombre" value="{{ datos.get('nombre', '') }}" minlength="2" maxlength="100" autocomplete="given-name" required>
            <label for="apellido">Apellido</label>
            <input id="apellido" name="apellido" value="{{ datos.get('apellido', '') }}" minlength="2" maxlength="100" autocomplete="family-name" required>
            <label for="email">E-mail</label>
            <input id="email" type="email" name="email" value="{{ datos.get('email', '') }}" maxlength="150" autocomplete="email" required>
            <label for="password">Contraseña</label>
            <input id="password" type="password" name="password" autocomplete="new-password" required>
            <label for="confirm_password">Conf. Contraseña</label>
            <input id="confirm_password" type="password" name="confirm_password" autocomplete="new-password" required>
            <button type="submit" class="submit">Registrar</button>
        </form>
    </section>
    <section aria-labelledby="login-titulo">
        <h2 id="login-titulo">Inicio de Sesión</h2>
        <form action="{{ url_for('login') }}" method="post" class="fields">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="login-email">E-mail</label>
            <input id="login-email" type="email" name="email" maxlength="150" autocomplete="username" required>
            <label for="login-password">Contraseña</label>
            <input id="login-password" type="password" name="password" autocomplete="current-password" required>
            <button type="submit" class="submit">Iniciar Sesión</button>
        </form>
    </section>
</div>
{% endblock %}
